# .cargo/config.toml — build configuration and cross-compilation settings

# ─────────────────────────────────────────────────────────────────────────────
# Build settings
# ─────────────────────────────────────────────────────────────────────────────
[build]
# Uncomment to use the mold linker for faster incremental dev builds on Linux:
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# ─────────────────────────────────────────────────────────────────────────────
# Linux — native (dynamic)
# ─────────────────────────────────────────────────────────────────────────────
# No `target-cpu=native` here: it is applied to every build on this target,
# including CI and release builds. Release binaries would then require the
# GitHub runner's CPU features (SIGILL on older CPUs), and proc-macros cached
# by CI on one runner crash with SIGILL on another. For a locally tuned build:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release

# ─────────────────────────────────────────────────────────────────────────────
# Linux — musl static binary (cargo build --target x86_64-unknown-linux-musl)
# ─────────────────────────────────────────────────────────────────────────────
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

# ─────────────────────────────────────────────────────────────────────────────
# macOS — set minimum deployment target for universal releases
# ─────────────────────────────────────────────────────────────────────────────
[target.x86_64-apple-darwin]
rustflags = []

[target.aarch64-apple-darwin]
rustflags = []

# ─────────────────────────────────────────────────────────────────────────────
# Aliases — convenience shortcuts
# ─────────────────────────────────────────────────────────────────────────────
[alias]
nt = "nextest run"
